<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Evaluation</title>
<style>
  :root{
    --ink:#13202b; --paper:#dcecf6; --panel:#ffffff; --line:#cfe2ee;
    --muted:#5b7080; --accent:#15ACE3; --accent-deep:#0e7fab; --accent-soft:#e2f4fc;
    --sky:#77D0F0; --gold:#0e7fab;
    --shadow:0 1px 2px rgba(13,32,43,.05),0 8px 24px rgba(13,90,130,.08);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
  header.top{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:26px;display:flex;align-items:flex-start;gap:18px}
  header.top .logo{width:56px;height:56px;flex:0 0 auto;border-radius:12px;background:#fff;border:1px solid var(--line);padding:7px;box-shadow:var(--shadow)}
  header.top .htext{flex:1 1 auto}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
  h1{font-family:"Georgia",serif;font-weight:600;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin-top:8px;max-width:62ch}
  .roles{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 28px;justify-content:center}
  .role-btn{border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink);transition:.15s}
  .role-btn:hover{border-color:var(--accent)}
  .role-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:26px}
  .field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
  .field input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--panel);font-family:inherit;color:var(--ink)}
  .field input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .field .ro{background:#f4f2ec;color:var(--muted)}
  .evaluator-ctl{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .evaluator-ctl span{font-size:13px;color:var(--muted)}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .stepper button{border:0;background:var(--panel);width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--accent);font-weight:600}
  .stepper button:hover{background:var(--accent-soft)}
  .stepper .val{width:36px;text-align:center;font-weight:600;font-size:14px;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:34px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:720px}
  thead th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:14px 8px;border-bottom:1px solid var(--line);background:#faf9f4}
  thead th.crit{text-align:left;min-width:260px;padding-left:20px}
  thead th.tot{color:var(--accent)}
  th .ev-sub{display:block;font-size:9.5px;letter-spacing:.04em;text-transform:none;color:var(--muted);font-weight:500;margin-top:2px}
  tbody td{padding:8px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
  tbody td.crit{text-align:left;font-size:13.5px;font-weight:500;padding-left:20px;color:var(--ink);max-width:340px;vertical-align:top}
  .crit-name{font-weight:600;color:var(--ink);margin-bottom:2px;font-size:14px}
  .crit-desc{font-weight:400;font-size:12px;color:var(--muted);line-height:1.35}
  tbody tr:last-child td{border-bottom:0}
  .score-in{width:58px;padding:7px 4px;text-align:center;border:1.5px solid var(--accent);border-radius:7px;font-size:13.5px;font-family:inherit;color:var(--ink)}
  .score-in:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .score-in.bad{border-color:#c0392b;background:#fdf0ee}
  .field input.bad{border-color:#c0392b;background:#fdf0ee}
  td.calc{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);font-size:14px}
  td.calc.dim{color:var(--muted);font-weight:500}
  .totals{display:flex;justify-content:flex-end;gap:14px;flex-wrap:wrap;padding:18px 20px;background:#faf9f4;border-top:1px solid var(--line)}
  .tcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 18px;min-width:140px;text-align:right}
  .tcard .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .tcard .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);font-family:"Georgia",serif}
  .interp{margin-left:auto;align-self:center;font-size:13px;color:var(--muted)}
  .interp b{color:var(--accent);font-weight:600}
  .comment{margin-top:24px}
  .comment label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
  .comment textarea{width:100%;min-height:90px;padding:11px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;resize:vertical;background:var(--panel);color:var(--ink)}
  .comment textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;align-items:center;justify-content:center}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:14px 28px;border-radius:11px;font-size:15.5px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--accent-deep)} .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--accent)} .btn.ghost:hover{background:var(--accent-soft)}
  .status{font-size:13px;color:var(--muted);flex-basis:100%;text-align:center}
  .hint{font-size:12px;color:var(--muted);margin-top:10px}

  /* --- employee name autocomplete --- */
  .ac-box{position:absolute;top:100%;left:0;right:0;z-index:50;margin-top:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:var(--shadow);overflow:hidden;display:none}
  .ac-box.open{display:block}
  .ac-item{padding:8px 11px;font-size:14px;cursor:pointer}
  .ac-item:hover,.ac-item.sel{background:var(--accent-soft);color:var(--accent-deep)}

  @media (max-width:560px){h1{font-size:24px}.wrap{padding-top:22px}}

  #logoutBtn{margin-left:auto}
  .manager-only{display:none!important}
  .employee-only{display:none}
  #empName{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--panel);color:var(--ink)}
  #managerPanel{display:none;margin:0 0 20px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
  #managerPanel select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .manager-bar{display:none}
  .auth-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--muted);font-size:14px}

  /* --- account sidebar --- */
  body{padding-left:0;transition:padding-left .2s ease}
  .account-sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:#13202b;color:#fff;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;z-index:1000;box-shadow:8px 0 30px rgba(13,32,43,.12)}
  .sidebar-brand{padding:24px 20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
  .sidebar-brand img{width:42px;height:42px;border-radius:12px;background:#fff;object-fit:cover;padding:4px}
  .sidebar-brand strong{font-size:15px;line-height:1.2}
  .sidebar-brand span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#77d0f0;margin-top:3px}
  .sidebar-account{padding:20px;border-bottom:1px solid rgba(255,255,255,.08)}
  .account-avatar{width:46px;height:46px;border-radius:50%;background:#15ACE3;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-bottom:11px}
  .account-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .account-email{font-size:11px;color:#aebfca;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .account-role{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:999px;background:rgba(21,172,227,.16);color:#77d0f0;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .sidebar-nav{padding:16px 12px;flex:1}
  .sidebar-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#718896;font-weight:700;padding:0 10px 8px}
  .sidebar-link{width:100%;border:0;background:transparent;color:#cbd8df;text-align:left;padding:11px 12px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .sidebar-link:hover{background:rgba(255,255,255,.07);color:#fff}
  .sidebar-link.active{background:#15ACE3;color:#fff}
  .sidebar-icon{width:20px;text-align:center;font-size:15px}
  .sidebar-footer{padding:14px 12px;border-top:1px solid rgba(255,255,255,.08)}
  .sidebar-logout{width:100%;border:1px solid rgba(255,255,255,.13);background:transparent;color:#d9e3e8;padding:10px 12px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px}
  .sidebar-logout:hover{background:rgba(255,255,255,.07);color:#fff}
  .sidebar-toggle{display:none}
  .sidebar-overlay{display:none}
  .app-main{margin-left:250px;min-height:100vh}
  .app-main .wrap{max-width:1080px}

  @media(max-width:800px){
    body.sidebar-open{overflow:hidden}
    .account-sidebar{transform:translateX(-100%);transition:transform .2s ease}
    body.sidebar-open .account-sidebar{transform:translateX(0)}
    .app-main{margin-left:0}
    .sidebar-toggle{display:flex;position:fixed;left:14px;top:14px;width:42px;height:42px;z-index:900;background:#13202b;color:#fff;border:0;border-radius:10px;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 5px 18px rgba(13,32,43,.2)}
    .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:950}
    body.sidebar-open .sidebar-overlay{display:block}
    .app-main .wrap{padding-top:72px}
  }
</style>
</head>

  const {data,error}=await supabaseClient.from('profiles').select('*').eq('id',user.id).single();

}

function setupEmployeeSelector(){
  const sel=document.getElementById('empName');
  sel.innerHTML='<option value="">Select employee to evaluate</option>';
  employeeList().filter(x=>x.id!==currentUser.id).forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;sel.appendChild(o);});
  sel.onchange=()=>{if(sel.value){sel.classList.remove('bad');syncEvaluators();}};
}
function selectedEmployeeId(){ return document.getElementById('empName').value; }
async function submitEvaluation(){
  if(!currentUser||isManager) return;
  const employeeId=selectedEmployeeId();
  if(!employeeId){alert('Please select the employee you are evaluating.');return;}
  if(employeeId===currentUser.id){alert('You cannot evaluate yourself.');return;}
  if(!requireValidScores()){alert('Please complete all scores before submitting.');return;}
  const data=currentData();
  const scoreMap={};
  FORMS[role].rows.forEach((row,i)=>{const v=scores[role]?.[i]?.[0]; if(v!==undefined) scoreMap[i]=v;});
  const btn=document.getElementById('submitBtn');btn.disabled=true;document.getElementById('status').textContent='Submitting…';
  const {error}=await supabaseClient.from('evaluations').insert({employee_id:employeeId,evaluator_id:currentUser.id,scores:scoreMap,average:data.avgScore,comments:document.getElementById('comment').value.trim(),form_role:role});
  btn.disabled=false;
  if(error){console.error(error);document.getElementById('status').textContent='Could not submit. '+error.message;return;}
  document.getElementById('status').textContent='Evaluation submitted successfully.';
  scores[role]={};ensureStore();evaluators=1;document.getElementById('empName').value='';document.getElementById('comment').value='';buildBody();buildHead();compute();
  setTimeout(()=>document.getElementById('status').textContent='You can select another employee to evaluate.',1500);
}
async function loadManagerEvaluations(){
  const {data,error}=await supabaseClient.from('evaluations').select('id,employee_id,evaluator_id,average,comments,created_at,form_role,scores,employee:employee_id(full_name),evaluator:evaluator_id(full_name)').order('created_at',{ascending:false});
  const sel=document.getElementById('evaluationSelect'); sel.innerHTML='<option value="">Select submitted evaluation</option>';
  if(error){console.error(error);document.getElementById('status').textContent='Could not load evaluations: '+error.message;return;}
  window.__evaluations=data||[];
  (data||[]).forEach(ev=>{const o=document.createElement('option');o.value=ev.id;o.textContent=`${ev.employee?.full_name||'Employee'} — evaluated by ${ev.evaluator?.full_name||'Employee'} — ${new Date(ev.created_at).toLocaleString()}`;sel.appendChild(o);});
}
function loadSelectedEvaluation(){
  const ev=(window.__evaluations||[]).find(x=>x.id===document.getElementById('evaluationSelect').value); if(!ev)return;
  role=ev.form_role||'Probationary';evaluators=1;scores[role]={};ensureStore();
  Object.entries(ev.scores||{}).forEach(([i,v])=>{scores[role][i]={0:Number(v)};});
  document.getElementById('empName').innerHTML=`<option value="${ev.employee_id}" selected>${ev.employee?.full_name||'Employee'}</option>`;
  document.getElementById('manager').value=ev.evaluator?.full_name||'Employee';
  document.getElementById('comment').value=ev.comments||'';
  render();compute();
}
async function bootAuth(){
  const loading=document.getElementById('authLoading');

  if(error || !session){
    window.location.replace('login.html');
    return;
  }

  await enterApp(session.user);
  if(loading) loading.remove();
}

  const scoreMap={};

  const btn=document.getElementById('submitBtn');btn.disabled=true;document.getElementById('status').textContent='Submitting…';
  const {error}=await supabaseClient.from('evaluations').insert({employee_id:employeeId,evaluator_id:currentUser.id,scores:scoreMap,average:data.avgScore,comments:document.getElementById('comment').value.trim(),form_role:role});
