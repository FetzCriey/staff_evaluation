<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Evaluation</title>
<style>
  :root{
    --ink:#13202b; --paper:#dcecf6; --panel:#ffffff; --line:#cfe2ee;
    --muted:#5b7080; --accent:#15ACE3; --accent-deep:#0e7fab; --accent-soft:#e2f4fc;
    --sky:#77D0F0; --gold:#0e7fab;
    --shadow:0 1px 2px rgba(13,32,43,.05),0 8px 24px rgba(13,90,130,.08);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
  header.top{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:26px;display:flex;align-items:flex-start;gap:18px}
  header.top .logo{width:56px;height:56px;flex:0 0 auto;border-radius:12px;background:#fff;border:1px solid var(--line);padding:7px;box-shadow:var(--shadow)}
  header.top .htext{flex:1 1 auto}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
  h1{font-family:"Georgia",serif;font-weight:600;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin-top:8px;max-width:62ch}
  .roles{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 28px;justify-content:center}
  .role-btn{border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink);transition:.15s}
  .role-btn:hover{border-color:var(--accent)}
  .role-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:26px}
  .field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
  .field input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--panel);font-family:inherit;color:var(--ink)}
  .field input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .field .ro{background:#f4f2ec;color:var(--muted)}
  .evaluator-ctl{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .evaluator-ctl span{font-size:13px;color:var(--muted)}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .stepper button{border:0;background:var(--panel);width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--accent);font-weight:600}
  .stepper button:hover{background:var(--accent-soft)}
  .stepper .val{width:36px;text-align:center;font-weight:600;font-size:14px;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:34px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:720px}
  thead th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:14px 8px;border-bottom:1px solid var(--line);background:#faf9f4}
  thead th.crit{text-align:left;min-width:260px;padding-left:20px}
  thead th.tot{color:var(--accent)}
  th .ev-sub{display:block;font-size:9.5px;letter-spacing:.04em;text-transform:none;color:var(--muted);font-weight:500;margin-top:2px}
  tbody td{padding:8px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
  tbody td.crit{text-align:left;font-size:13.5px;font-weight:500;padding-left:20px;color:var(--ink);max-width:340px;vertical-align:top}
  .crit-name{font-weight:600;color:var(--ink);margin-bottom:2px;font-size:14px}
  .crit-desc{font-weight:400;font-size:12px;color:var(--muted);line-height:1.35}
  tbody tr:last-child td{border-bottom:0}
  .score-in{width:58px;padding:7px 4px;text-align:center;border:1.5px solid var(--accent);border-radius:7px;font-size:13.5px;font-family:inherit;color:var(--ink)}
  .score-in:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .score-in.bad{border-color:#c0392b;background:#fdf0ee}
  .field input.bad{border-color:#c0392b;background:#fdf0ee}
  td.calc{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);font-size:14px}
  td.calc.dim{color:var(--muted);font-weight:500}
  .totals{display:flex;justify-content:flex-end;gap:14px;flex-wrap:wrap;padding:18px 20px;background:#faf9f4;border-top:1px solid var(--line)}
  .tcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 18px;min-width:140px;text-align:right}
  .tcard .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .tcard .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);font-family:"Georgia",serif}
  .interp{margin-left:auto;align-self:center;font-size:13px;color:var(--muted)}
  .interp b{color:var(--accent);font-weight:600}
  .comment{margin-top:24px}
  .comment label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
  .comment textarea{width:100%;min-height:90px;padding:11px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;resize:vertical;background:var(--panel);color:var(--ink)}
  .comment textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;align-items:center;justify-content:center}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:14px 28px;border-radius:11px;font-size:15.5px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--accent-deep)} .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--accent)} .btn.ghost:hover{background:var(--accent-soft)}
  .status{font-size:13px;color:var(--muted);flex-basis:100%;text-align:center}
  .hint{font-size:12px;color:var(--muted);margin-top:10px}

  /* --- employee name autocomplete --- */
  .ac-box{position:absolute;top:100%;left:0;right:0;z-index:50;margin-top:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:var(--shadow);overflow:hidden;display:none}
  .ac-box.open{display:block}
  .ac-item{padding:8px 11px;font-size:14px;cursor:pointer}
  .ac-item:hover,.ac-item.sel{background:var(--accent-soft);color:var(--accent-deep)}

  @media (max-width:560px){h1{font-size:24px}.wrap{padding-top:22px}}

  #logoutBtn{margin-left:auto}
  .manager-only{display:none!important}
  .employee-only{display:none}
  #empName{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--panel);color:var(--ink)}
  #managerPanel{display:none;margin:0 0 20px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
  #managerPanel select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .manager-bar{display:none}
  .auth-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--muted);font-size:14px}

  /* --- account sidebar --- */
  body{padding-left:0;transition:padding-left .2s ease}
  .account-sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:#13202b;color:#fff;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;z-index:1000;box-shadow:8px 0 30px rgba(13,32,43,.12)}
  .sidebar-brand{padding:24px 20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
  .sidebar-brand img{width:42px;height:42px;border-radius:12px;background:#fff;object-fit:cover;padding:4px}
  .sidebar-brand strong{font-size:15px;line-height:1.2}
  .sidebar-brand span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#77d0f0;margin-top:3px}
  .sidebar-account{padding:20px;border-bottom:1px solid rgba(255,255,255,.08)}
  .account-avatar{width:46px;height:46px;border-radius:50%;background:#15ACE3;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-bottom:11px}
  .account-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .account-email{font-size:11px;color:#aebfca;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .account-role{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:999px;background:rgba(21,172,227,.16);color:#77d0f0;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .sidebar-nav{padding:16px 12px;flex:1}
  .sidebar-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#718896;font-weight:700;padding:0 10px 8px}
  .sidebar-link{width:100%;border:0;background:transparent;color:#cbd8df;text-align:left;padding:11px 12px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .sidebar-link:hover{background:rgba(255,255,255,.07);color:#fff}
  .sidebar-link.active{background:#15ACE3;color:#fff}
  .sidebar-icon{width:20px;text-align:center;font-size:15px}
  .sidebar-footer{padding:14px 12px;border-top:1px solid rgba(255,255,255,.08)}
  .sidebar-logout{width:100%;border:1px solid rgba(255,255,255,.13);background:transparent;color:#d9e3e8;padding:10px 12px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px}
  .sidebar-logout:hover{background:rgba(255,255,255,.07);color:#fff}
  .sidebar-toggle{display:none}
  .sidebar-overlay{display:none}
  .app-main{margin-left:250px;min-height:100vh}
  .app-main .wrap{max-width:1080px}

  @media(max-width:800px){
    body.sidebar-open{overflow:hidden}
    .account-sidebar{transform:translateX(-100%);transition:transform .2s ease}
    body.sidebar-open .account-sidebar{transform:translateX(0)}
    .app-main{margin-left:0}
    .sidebar-toggle{display:flex;position:fixed;left:14px;top:14px;width:42px;height:42px;z-index:900;background:#13202b;color:#fff;border:0;border-radius:10px;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 5px 18px rgba(13,32,43,.2)}
    .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:950}
    body.sidebar-open .sidebar-overlay{display:block}
    .app-main .wrap{padding-top:72px}
  }
</style>
</head>
<body>
<div id="authLoading" class="auth-loading">Checking your sign-in…</div>
<div id="appShell" style="display:none">
  <aside class="account-sidebar" id="accountSidebar">
    <div class="sidebar-brand">
      <img src="123.png" alt="Company logo">
      <div><strong>Performance<br>Evaluation</strong><span>Better Practice</span></div>
    </div>
    <div class="sidebar-account">
      <div class="account-avatar" id="accountAvatar">U</div>
      <div class="account-name" id="accountName">Employee</div>
      <div class="account-email" id="accountEmail"></div>
      <div class="account-role" id="accountRole">Employee</div>
    </div>
    <nav class="sidebar-nav" aria-label="Account navigation">
      <div class="sidebar-label">Workspace</div>
      <button class="sidebar-link active" id="navEvaluation" type="button"><span class="sidebar-icon">▣</span>Evaluation</button>
      <button class="sidebar-link manager-only" id="navSubmitted" type="button"><span class="sidebar-icon">☷</span>Submitted Evaluations</button>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-logout" id="sidebarLogout" type="button"><span class="sidebar-icon">↪</span>Log out</button>
    </div>
  </aside>
  <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Open menu">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <main class="app-main">
  <div class="wrap">
  <header class="top">
    <img class="logo" id="logoImg" alt="Company logo">
    <div class="htext">
      <div class="eyebrow">Employee Assessment</div>
      <h1>Performance Evaluation</h1>
    </div>
  </header>

  <div class="roles" id="roles"></div>

  <div class="meta">
    <div class="field"><label>Employee being evaluated</label><select id="empName"><option value="">Select employee to evaluate</option></select></div>
    <div class="field"><label>Position</label><input id="position" class="ro" readonly></div>
    <div class="field" id="managerField"><label>Manager / Evaluator</label><input id="manager" value="Aiko Yasuda"></div>
    <div class="field"><label>Date</label><input id="date" class="ro" readonly></div>
  </div>

  <div class="evaluator-ctl">
    <span>Evaluators</span>
    <div class="stepper">
      <button id="evMinus" aria-label="Remove evaluator">&minus;</button>
      <div class="val" id="evVal">6</div>
      <button id="evPlus" aria-label="Add evaluator">+</button>
    </div>
  </div>

  <div id="managerPanel"><label class="field"><span>Submitted evaluations</span><select id="evaluationSelect"><option value="">Select submitted evaluation</option></select></label><button class="btn" id="loadEvaluationBtn" style="margin-top:10px">Load Evaluation</button></div>

<div class="panel">
    <div class="scroll">
      <table id="grid"><thead><tr id="headRow"></tr></thead><tbody id="body"></tbody></table>
    </div>
    <div class="totals">
      <div class="interp" id="interp"></div>
      <div class="tcard"><div class="k">Total Score</div><div class="v" id="totalScore">0</div></div>
      <div class="tcard"><div class="k">Average Score</div><div class="v" id="totalAvg">0</div></div>
    </div>
  </div>

  <div class="comment">
    <label>Evaluator's overall comments</label>
    <textarea id="comment" placeholder="Overall remarks..."></textarea>
  </div>

  <div class="actions">
    <button class="btn manager-only" id="printBtn">Print</button>
    <button class="btn manager-only" id="pdfBtn">Export to PDF</button>
    <button class="btn ghost manager-only" id="exportBtn">Export to Word</button>
    <button class="btn ghost manager-only" id="resetBtn">Clear scores</button>
    <button class="btn employee-only" id="submitBtn">Submit Evaluation</button>
    <span class="status" id="status"></span>
  </div>
  </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://giosjwjhalhmwcuyzfos.supabase.co";
const SUPABASE_KEY="sb_publishable_9guZ2oKWHmKyFx3WyvHYww_cTYlQsX_";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null,isManager=false;

async function loadProfile(user){
  const {data,error}=await supabaseClient.from('profiles').select('*').eq('id',user.id).single();
  if(error) throw error;
  currentProfile=data; isManager=data.role==='manager';
}
function employeeList(){ return [
  {id:'c2ca1d60-5083-4e53-b296-ef420065ce39',name:'Mark Ian Buenzalida'},
  {id:'78d92f3e-282d-4be2-9862-4767c1ef6e0d',name:'John Dionisio'},
  {id:'d874ad74-753e-4550-912d-b3c88bde632e',name:'Rosalyn Villano'},
  {id:'ec9c61af-4ac2-47da-9717-f905a4856088',name:'Monique Eileen Irog-Irog'},
  {id:'c188c278-c48c-4d5d-a807-0cf76a27a625',name:'Marivie Marquez'},
  {id:'401bb59a-fd20-4a2d-b625-f1b308bc578d',name:'Camila Mae Haduca'}
];}
function setupEmployeeSelector(){
  const sel=document.getElementById('empName');
  sel.innerHTML='<option value="">Select employee to evaluate</option>';
  employeeList().filter(x=>x.id!==currentUser.id).forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;sel.appendChild(o);});
  sel.onchange=()=>{if(sel.value){sel.classList.remove('bad');syncEvaluators();}};
}
function selectedEmployeeId(){ return document.getElementById('empName').value; }
async function submitEvaluation(){
  if(!currentUser||isManager) return;
  const employeeId=selectedEmployeeId();
  if(!employeeId){alert('Please select the employee you are evaluating.');return;}
  if(employeeId===currentUser.id){alert('You cannot evaluate yourself.');return;}
  if(!requireValidScores()){alert('Please complete all scores before submitting.');return;}
  const data=currentData();
  const scoreMap={};
  FORMS[role].rows.forEach((row,i)=>{const v=scores[role]?.[i]?.[0]; if(v!==undefined) scoreMap[i]=v;});
  const btn=document.getElementById('submitBtn');btn.disabled=true;document.getElementById('status').textContent='Submitting…';
  const {error}=await supabaseClient.from('evaluations').insert({employee_id:employeeId,evaluator_id:currentUser.id,scores:scoreMap,average:data.avgScore,comments:document.getElementById('comment').value.trim(),form_role:role});
  btn.disabled=false;
  if(error){console.error(error);document.getElementById('status').textContent='Could not submit. '+error.message;return;}
  document.getElementById('status').textContent='Evaluation submitted successfully.';
  scores[role]={};ensureStore();evaluators=1;document.getElementById('empName').value='';document.getElementById('comment').value='';buildBody();buildHead();compute();
  setTimeout(()=>document.getElementById('status').textContent='You can select another employee to evaluate.',1500);
}
async function loadManagerEvaluations(){
  const {data,error}=await supabaseClient.from('evaluations').select('id,employee_id,evaluator_id,average,comments,created_at,form_role,scores,employee:employee_id(full_name),evaluator:evaluator_id(full_name)').order('created_at',{ascending:false});
  const sel=document.getElementById('evaluationSelect'); sel.innerHTML='<option value="">Select submitted evaluation</option>';
  if(error){console.error(error);document.getElementById('status').textContent='Could not load evaluations: '+error.message;return;}
  window.__evaluations=data||[];
  (data||[]).forEach(ev=>{const o=document.createElement('option');o.value=ev.id;o.textContent=`${ev.employee?.full_name||'Employee'} — evaluated by ${ev.evaluator?.full_name||'Employee'} — ${new Date(ev.created_at).toLocaleString()}`;sel.appendChild(o);});
}
function loadSelectedEvaluation(){
  const ev=(window.__evaluations||[]).find(x=>x.id===document.getElementById('evaluationSelect').value); if(!ev)return;
  role=ev.form_role||'Probationary';evaluators=1;scores[role]={};ensureStore();
  Object.entries(ev.scores||{}).forEach(([i,v])=>{scores[role][i]={0:Number(v)};});
  document.getElementById('empName').innerHTML=`<option value="${ev.employee_id}" selected>${ev.employee?.full_name||'Employee'}</option>`;
  document.getElementById('manager').value=ev.evaluator?.full_name||'Employee';
  document.getElementById('comment').value=ev.comments||'';
  render();compute();
}
async function bootAuth(){
  const loading=document.getElementById('authLoading');
  const {data:{session},error}=await supabaseClient.auth.getSession();

  if(error || !session){
    window.location.replace('login.html');
    return;
  }

  await enterApp(session.user);
  if(loading) loading.remove();
}

async function enterApp(user){
  currentUser=user;

  try{
    await loadProfile(user);
  }catch(e){
    console.error('Profile lookup failed:',e);
    await supabaseClient.auth.signOut();
    window.location.replace('login.html');
    return;
  }

  document.getElementById('appShell').style.display='block';

  // Populate the account sidebar from the signed-in Supabase user/profile.
  const displayName=currentProfile.full_name||user.email||'Employee';
  const roleLabel=isManager?'Manager':'Employee';
  const initials=displayName.trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'U';
  document.getElementById('accountAvatar').textContent=initials;
  document.getElementById('accountName').textContent=displayName;
  document.getElementById('accountEmail').textContent=user.email||'';
  document.getElementById('accountRole').textContent=roleLabel;

  const logout=async()=>{
    await supabaseClient.auth.signOut();
    window.location.replace('login.html');
  };
  document.getElementById('sidebarLogout').onclick=logout;

  const toggleSidebar=()=>document.body.classList.toggle('sidebar-open');
  document.getElementById('sidebarToggle').onclick=toggleSidebar;
  document.getElementById('sidebarOverlay').onclick=()=>document.body.classList.remove('sidebar-open');

  document.getElementById('navEvaluation').onclick=()=>{
    document.body.classList.remove('sidebar-open');
    document.querySelector('.sidebar-link.active')?.classList.remove('active');
    document.getElementById('navEvaluation').classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  };

  document.getElementById('navSubmitted').onclick=()=>{
    document.body.classList.remove('sidebar-open');
    document.querySelector('.sidebar-link.active')?.classList.remove('active');
    document.getElementById('navSubmitted').classList.add('active');
    document.getElementById('managerPanel').scrollIntoView({behavior:'smooth',block:'start'});
  };

  setupEmployeeSelector();

  if(isManager){
    document.getElementById('managerPanel').style.display='block';
    document.querySelectorAll('.manager-only').forEach(x=>x.style.setProperty('display','inline-block','important'));
    document.querySelectorAll('.employee-only').forEach(x=>x.style.setProperty('display','none','important'));
    document.getElementById('submitBtn').style.display='none';
    document.getElementById('empName').disabled=true;
    await loadManagerEvaluations();
  }else{
    document.getElementById('managerPanel').style.display='none';
    document.querySelectorAll('.manager-only').forEach(x=>x.style.setProperty('display','none','important'));
    document.querySelectorAll('.employee-only').forEach(x=>x.style.setProperty('display','inline-block','important'));
    document.getElementById('submitBtn').style.display='inline-block';
    document.getElementById('empName').disabled=false;
    document.getElementById('manager').value=currentProfile.full_name;
    document.getElementById('manager').readOnly=true;
    document.getElementById('manager').classList.add('ro');
    evaluators=1;
    document.getElementById('evVal').textContent='1';
  }

  render();

  if(!isManager){
    setupEmployeeSelector();
    evaluators=1;
    document.getElementById('evVal').textContent='1';
    buildHead();buildBody();compute();
  }
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT' || !session){
    window.location.replace('login.html');
  }
});

document.getElementById('loadEvaluationBtn').onclick=loadSelectedEvaluation;

let role="Probationary", evaluators=6;
const MIN_EV=1,MAX_EV=10;
let scores={};
let managerSaved={normal:"Aiko Yasuda", senior:"Client Relation Department"};

const round1=n=>Math.round(n*10)/10;
function ensureStore(){ if(!scores[role])scores[role]={}; FORMS[role].rows.forEach((_,i)=>{ if(!scores[role][i])scores[role][i]={}; }); }

function buildRoles(){
  const c=document.getElementById('roles'); c.innerHTML='';
  Object.keys(FORMS).forEach(r=>{
    const b=document.createElement('button');
    b.className='role-btn'+(r===role?' active':''); b.textContent=r;
    b.onclick=()=>{role=r;render();}; c.appendChild(b);
  });
}
function buildHead(){
  const names=evaluatorNames();
  let h='<th class="crit">Criteria &amp; Description</th>';
  for(let e=0;e<evaluators;e++){
    const nm=names[e];
    h+= nm ? `<th title="${nm}">${nm}<span class="ev-sub">Eval ${e+1}</span></th>`
           : `<th>Eval ${e+1}</th>`;
  }
  h+='<th class="tot">Score</th><th class="tot">Average</th>';
  document.getElementById('headRow').innerHTML=h;
}
function buildBody(){
  ensureStore();
  const tb=document.getElementById('body'); tb.innerHTML='';
  FORMS[role].rows.forEach(([name,desc],ci)=>{
    const tr=document.createElement('tr');
    let cells=`<td class="crit"><div class="crit-name">${ci+1}. ${name}</div><div class="crit-desc">${desc}</div></td>`;
    for(let e=0;e<evaluators;e++){
      const v=scores[role][ci][e]??'';
      cells+=`<td><input class="score-in" inputmode="decimal" data-c="${ci}" data-e="${e}" value="${v}"></td>`;
    }
    cells+=`<td class="calc" id="sc-${ci}">0</td><td class="calc dim" id="av-${ci}">0</td>`;
    tr.innerHTML=cells; tb.appendChild(tr);
  });
  tb.querySelectorAll('.score-in').forEach(inp=>{
    inp.addEventListener('input',onScoreInput);
    inp.addEventListener('keydown',onScoreKey);
    inp.addEventListener('blur',onScoreBlur);
  });
}
function onScoreBlur(e){
  const inp=e.target;
  if(cellValid(inp)) return;          // valid or empty -> allow leaving
  // allow leaving to buttons/other controls (don't trap the user out of the grid)
  const to=e.relatedTarget;
  if(to && !to.classList.contains('score-in')) return;
  inp.classList.add('bad');
  const st=document.getElementById('status');
  st.textContent="Enter a value from 1 to 5 (decimals allowed) before moving on.";
  setTimeout(()=>{ if(st.textContent.startsWith("Enter a value")) st.textContent=""; },2500);
  // pull focus back to the invalid box
  setTimeout(()=>{ inp.focus(); inp.select(); },0);
}
function focusCell(ci,ev){
  const el=document.querySelector(`.score-in[data-c="${ci}"][data-e="${ev}"]`);
  if(el){ el.focus(); el.select(); }
  return !!el;
}
function cellValid(inp){
  const raw=inp.value.trim();
  if(raw==="") return true; // empty is allowed (just skipped)
  if(!/^\d+(\.\d{1,2})?$/.test(raw)) return false; // digits, optional 1-2 decimals
  const num=Number(raw);
  return !(isNaN(num)||num<SCALE_MIN||num>SCALE_MAX);
}
function onScoreKey(e){
  const inp=e.target, ci=+inp.dataset.c, ev=+inp.dataset.e;
  const lastRow=FORMS[role].rows.length-1, lastCol=evaluators-1;
  const navKeys=["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter","Tab"];
  // If trying to leave this box but the value is invalid, block it
  if(navKeys.includes(e.key) && !cellValid(inp)){
    e.preventDefault();
    inp.classList.add('bad');
    inp.focus(); inp.select();
    const st=document.getElementById('status');
    st.textContent="Enter a value from 1 to 5 (decimals allowed) before moving on.";
    setTimeout(()=>{ if(st.textContent.startsWith("Enter a value")) st.textContent=""; },2500);
    return;
  }
  let handled=true;
  switch(e.key){
    case "ArrowUp":   focusCell(ci>0?ci-1:lastRow, ev); break;
    case "ArrowDown":
    case "Enter":     focusCell(ci<lastRow?ci+1:0, ev); break;
    case "ArrowRight":
      // jump to next column only when cursor is at end of the text
      if(inp.selectionStart===inp.value.length){
        if(ev<lastCol) focusCell(ci, ev+1);
        else if(ci<lastRow) focusCell(ci+1, 0); // wrap to next row start
        else handled=false;
      } else handled=false;
      break;
    case "ArrowLeft":
      if(inp.selectionStart===0){
        if(ev>0) focusCell(ci, ev-1);
        else if(ci>0) focusCell(ci-1, lastCol); // wrap to prev row end
        else handled=false;
      } else handled=false;
      break;
    default: handled=false;
  }
  if(handled) e.preventDefault();
}
function onScoreInput(e){
  const inp=e.target, ci=+inp.dataset.c, ev=+inp.dataset.e, raw=inp.value.trim();
  if(raw===''){ delete scores[role][ci][ev]; inp.classList.remove('bad'); compute(); return; }
  if(raw==="."){ inp.classList.add('bad'); return; }
  const typing=/^\d+\.$/.test(raw);              // e.g. "4." while still typing
  const num=Number(raw);
  if(isNaN(num)||num<SCALE_MIN||num>SCALE_MAX||(!typing&&!/^\d+(\.\d{1,2})?$/.test(raw))){
    inp.classList.add('bad'); return;
  }
  inp.classList.remove('bad'); scores[role][ci][ev]=num; compute();
}
function interpret(avg){
  if(avg>=4.5)return"Outstanding"; if(avg>=3.5)return"Very Good";
  if(avg>=2.5)return"Satisfactory"; if(avg>=1.5)return"Needs Improvement";
  if(avg>0)return"Poor"; return"";
}
function compute(){
  let avgVals=[], scoreVals=[];
  FORMS[role].rows.forEach((_,ci)=>{
    const obj=scores[role][ci], vals=[];
    for(let e=0;e<evaluators;e++) if(obj[e]!==undefined) vals.push(obj[e]);
    const sum=round1(vals.reduce((a,b)=>a+b,0));
    const avg=vals.length?round1(sum/vals.length):0;
    document.getElementById('sc-'+ci).textContent=sum;
    document.getElementById('av-'+ci).textContent=avg;
    if(vals.length){ avgVals.push(avg); scoreVals.push(sum); }
  });
  const totalScore=round1(scoreVals.reduce((a,b)=>a+b,0));
  const avgScore=avgVals.length?round1(avgVals.reduce((a,b)=>a+b,0)/avgVals.length):0;
  document.getElementById('totalScore').textContent=totalScore;
  document.getElementById('totalAvg').textContent=avgScore;
  const word=interpret(avgScore);
  document.getElementById('interp').innerHTML=word?`Interpretation: <b>${word}</b>`:'';
}
function currentData(){
  const scoreRows=[], avgRows=[];
  FORMS[role].rows.forEach((_,ci)=>{
    const obj=scores[role][ci], vals=[];
    for(let e=0;e<evaluators;e++) if(obj[e]!==undefined) vals.push(obj[e]);
    if(vals.length){
      scoreRows.push(round1(vals.reduce((a,b)=>a+b,0)));
      avgRows.push(round1(vals.reduce((a,b)=>a+b,0)/vals.length));
    }else{ scoreRows.push(null); avgRows.push(null); }
  });
  const filledScores=scoreRows.filter(v=>v!==null);
  const totalScore=round1(filledScores.reduce((a,b)=>a+b,0)); // sum of the criterion scores (cell values)
  const filledAvg=avgRows.filter(v=>v!==null);
  const avgScore=filledAvg.length?round1(filledAvg.reduce((a,b)=>a+b,0)/filledAvg.length):0; // mean rating 1-5
  // rows = the value placed in the form's Rating cell = the SCORE (sum of evaluators)
  const maxPossible=FORMS[role].rows.length*SCALE_MAX*evaluators;
  return {rows:scoreRows, scoreRows, avgRows, totalScore, avgScore, maxPossible};
}
function render(){
  buildRoles(); buildHead(); buildBody();
  document.getElementById('position').value=FORMS[role].position;
  const mField=document.getElementById('managerField');
  const mInput=document.getElementById('manager');
  // remember the value the user had for the previous field type
  mField.querySelector('label').textContent=FORMS[role].senior?"Department":"Manager / Evaluator";
  if(currentProfile && !isManager){
    mField.querySelector('label').textContent="Evaluator";
    mInput.value=currentProfile.full_name;
    mInput.readOnly=true;
  }else if(FORMS[role].senior){
    if(managerSaved.senior===undefined) managerSaved.senior="CRO";
    mInput.value=managerSaved.senior;
    mInput.readOnly=false;
  }else{
    if(managerSaved.normal===undefined) managerSaved.normal="Aiko Yasuda";
    mInput.value=managerSaved.normal;
    mInput.readOnly=false;
  }
  document.getElementById('evVal').textContent=evaluators;
  compute();
  syncEvaluators(true);
}

function requireName(){
  const inp=document.getElementById('empName');
  let name=inp.value.trim();

    inp.classList.add('bad');
    inp.focus();
    alert("Please enter the employee name first.");
    return false;
  }
  name=toProperCase(name);
  inp.value=name;
  inp.classList.remove('bad');
  return true;
}
function requireValidScores(){
  const boxes=document.querySelectorAll('.score-in');
  for(const inp of boxes){
    if(!cellValid(inp)){
      inp.classList.add('bad');
      inp.focus(); inp.select();
      const st=document.getElementById('status');
      st.textContent="Fix the highlighted score (must be 1-5, decimals allowed).";
      setTimeout(()=>{ if(st.textContent.startsWith("Fix the highlighted")) st.textContent=""; },2500);
      return false;
    }
  }
  return true;
}

function openPrint(){
  // Remove any previous print frame so it only ever prints once
  const old=document.getElementById('__printFrame');
  if(old) old.remove();
  const frame=document.createElement('iframe');
  frame.id='__printFrame';
  frame.style.position='fixed';
  frame.style.right='0';
  frame.style.bottom='0';
  frame.style.width='0';
  frame.style.height='0';
  frame.style.border='0';
  frame.setAttribute('aria-hidden','true');
  document.body.appendChild(frame);
  let printed=false;
  const doPrint=()=>{
    if(printed) return; printed=true;
    try{
      const win=frame.contentWindow;
      win.focus();
      win.print();
    }catch(e){ console.error(e); document.getElementById('status').textContent="Couldn't open print. Try again."; }
    // clean up shortly after the dialog is dismissed
    setTimeout(()=>{ const f=document.getElementById('__printFrame'); if(f) f.remove(); }, 1500);
  };
  frame.onload=doPrint;
  const doc=frame.contentWindow.document;
  doc.open(); doc.write(formHTML()); doc.close();
  // fallback in case onload already fired before handler attached
  setTimeout(doPrint, 700);
}

function xmlEsc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function run(text,{bold=false,italic=false,color=null,sz=22}={}){

  if(bold)rpr+="<w:b/><w:bCs/>"; if(italic)rpr+="<w:i/><w:iCs/>";
  if(color)rpr+=`<w:color w:val="${color}"/>`;

  return `<w:r>${rpr}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r>`;

function para(runs,{align=null,after=160,before=0}={}){

// ---- Minimal ZIP writer (stored, no compression) ----
function b64ToBytes(b64){
  const bin=atob(b64); const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder();
  const chunks=[], central=[]; let offset=0;
  const u16=v=>[v&0xFF,(v>>>8)&0xFF];
  const u32=v=>[v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF];
  files.forEach(f=>{
    const nameB=enc.encode(f.name);
    const dataB=(f.data instanceof Uint8Array)?f.data:enc.encode(f.data);
    const crc=crc32(dataB);
    const local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(dataB.length),u32(dataB.length),u16(nameB.length),u16(0));
    chunks.push(new Uint8Array(local),nameB,dataB);
    const localLen=local.length+nameB.length+dataB.length;
    const cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(dataB.length),u32(dataB.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),
      u32(0),u32(offset));
    central.push(new Uint8Array(cen),nameB);
    offset+=localLen;
  });
  let cenSize=0; central.forEach(c=>cenSize+=c.length);
  const end=[].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),
    u32(cenSize),u32(offset),u16(0));
  const parts=[...chunks,...central,new Uint8Array(end)];
  return new Blob(parts,{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

  const ops=[];
  const T=(x,y,s,size,bold,color)=>ops.push(`BT /${bold?'FB':'F1'} ${size} Tf ${color||black} rg 1 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)} Tm (${pdfEsc(s)}) Tj ET`);
  const L=(x1,y1,x2,y2)=>ops.push(`0.6 0.78 0.86 RG 0.8 w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
  const RF=(x,y,w,h,c)=>ops.push(`${c} rg ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
  // label+value helper with proper spacing
  const KV=(x,y,k,v)=>{ T(x,y,k,10,true); T(x+twF(k,10,true)+3,y,v,10,false); };
  // fully-bold "key value" (matches Prob/Junior where whole meta line is bold)
  const KVB=(x,y,k,v)=>{ T(x,y,k,10,true); T(x+twF(k,10,true)+3,y,v,10,true); };
  const BUL=(x,y,k,v)=>{ T(x,y,"\u2022",10,true); T(x+12,y,k,10,true); T(x+12+twF(k,10,true)+3,y,v,10,true); };

  let y=H-M;
  const LS=46;
  ops.push(`q ${LS} 0 0 ${LS} ${((W-LS)/2).toFixed(2)} ${(y-LS).toFixed(2)} cm /Im1 Do Q`);
  y-=LS+16;
  const title=f.title, ts=11;
  T((W-twF(title,ts,true))/2,y,title,ts,true,blue); y-=18;
  T(M,y,"Confidential - For Internal Use Only",10,true); y-=18;
  if(f.senior){
    KV(M,y,"Manager Name:",empName||"________________________"); y-=15;
    KV(M,y,"Department:",manager||"__________________________"); y-=15;
    KV(M,y,"Date:",dateStr||"_______________"); y-=15;
  }else{
    KVB(M,y,"Employee Name:",empName||"________________________"); y-=15;
    KVB(M,y,"Position:",f.position); y-=15;
    KVB(M,y,"Evaluator (Manager):",manager||"_______________________"); y-=15;
    KVB(M,y,"Date:",dateStr||"_______________"); y-=15;
  }
  y-=4;
  T(M,y,"Rating Scale:",10,true); y-=13;
  T(M,y,"5 - Excellent | 4 - Very Good | 3 - Satisfactory | 2 - Needs Improvement | 1 - Poor",10,!f.senior); y-=18;

  // centered-text helper
  const TC=(cx,cw,yy,s,size,bold,color)=>T(cx+cw/2-twF(s,size,bold)/2,yy,s,size,bold,color);
  const cols=[44,150,238,82], x0=M, tableW=cols.reduce((a,b)=>a+b,0);
  const colX=[x0]; for(let i=0;i<cols.length;i++) colX.push(colX[i]+cols[i]);
  const hh=22, tts=10;
  RF(x0,y-hh+5,tableW,hh,"0.886 0.957 0.988");
  TC(colX[0],cols[0],y-11,"No.",tts,true);
  TC(colX[1],cols[1],y-11,"Criteria",tts,true);
  TC(colX[2],cols[2],y-11,"Description",tts,true);
  TC(colX[3],cols[3],y-11,"Rating (1-5)",tts,true);
  const ytop=y+5; y-=hh;
  const pad=7,lh=12;
  f.rows.forEach(([name,desc],i)=>{
    const r=data.rows[i];
    const nameLines=wrapF(name,tts,cols[1]-2*5,false);
    const descLines=wrapF(desc,tts,cols[2]-2*5,false);
    const n=Math.max(nameLines.length,descLines.length,1);
    const rh=n*lh+2*pad;
    const noBold=!f.senior;
    TC(colX[0],cols[0], y-rh/2-tts/2+2, String(i+1), tts, noBold);
    const nameStart=y - (rh-(nameLines.length*lh))/2 - tts + 2;
    nameLines.forEach((ln,j)=>TC(colX[1],cols[1], nameStart-j*lh, ln, tts, false));
    const descStart=y - (rh-(descLines.length*lh))/2 - tts + 2;
    descLines.forEach((ln,j)=>TC(colX[2],cols[2], descStart-j*lh, ln, tts, false));
    const rate=r!==null?String(r):"";
    TC(colX[3],cols[3], y-rh/2-tts/2+2, rate, tts, true);
    y-=rh; L(x0,y,x0+tableW,y);
  });
  const ybot=y;
  colX.forEach(cx=>L(cx,ytop,cx,ybot));
  L(x0,ytop,x0+tableW,ytop); L(x0,ytop-hh,x0+tableW,ytop-hh);
  y-=16;
  T(M,y,"Scoring Guide:",10,true); y-=15;
  BUL(M,y,"Total Score:",(data.totalScore||0)+""); y-=14;
  BUL(M,y,"Average Score:",String(data.avgScore||0)); y-=18;
  T(M,y,"Performance Interpretation:",10,true); y-=13;
  ["4.5 - 5.0 = Outstanding","3.5 - 4.4 = Very Good","2.5 - 3.4 = Satisfactory","1.5 - 2.4 = Needs Improvement","1.0 - 1.4 = Poor"].forEach(t=>{
    const on=cur&&t.indexOf(cur)>-1;
    T(M,y,t,10,!f.senior||on,on?deep:black); y-=12;
  });
  y-=8;
  T(M,y,"Evaluator's Overall Comments:",10,true); y-=14;
  wrapF(comment||" ",10,tableW,false).forEach(ln=>{ T(M,y,ln,10,false); y-=13; });
  if(!f.senior){
    y-=6;
    KVB(M,y,"Evaluator's Signature:","_______________________"); y-=13;
    KVB(M,y,"Date:",dateStr||"_______________"); y-=13;
  }

  // assemble PDF bytes
  const content=ops.join("\n");
  const enc=new TextEncoder();
  const jpg=b64ToBytes(LOGO_JPG_B64);
  const parts=[]; let pdfLen=0;
  const push=(buf)=>{ parts.push(buf); pdfLen+=buf.length; };
  const pushStr=(s)=>push(enc.encode(s));
  const offsets=[];
  pushStr("%PDF-1.4\n");
  const obj=(num,headStr,binBuf,tailStr)=>{
    offsets[num]=pdfLen;
    pushStr(`${num} 0 obj\n`);
    pushStr(headStr);
    if(binBuf) push(binBuf);
    if(tailStr) pushStr(tailStr);
    pushStr("\nendobj\n");
  };
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 5 0 R /FB 6 0 R >> /XObject << /Im1 7 0 R >> >> /Contents 4 0 R >>`);
  obj(4,`<< /Length ${enc.encode(content).length} >>\nstream\n${content}\nendstream`);
  obj(5,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
  obj(6,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>");
  obj(7,`<< /Type /XObject /Subtype /Image /Width 140 /Height 140 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`,jpg,"\nendstream");
  const xrefStart=pdfLen;
  let xref=`xref\n0 8\n0000000000 65535 f \n`;
  for(let i=1;i<=7;i++) xref+=String(offsets[i]).padStart(10,'0')+" 00000 n \n";
  pushStr(xref);
  pushStr(`trailer\n<< /Size 8 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);

  const blob=new Blob(parts,{type:"application/pdf"});
  const safe=(empName.replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"_"))||"Form";
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`${safe}_Evaluation.pdf`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

function toProperCase(s){
  return s.toLowerCase()
    .replace(/\s+/g,' ').trim()
    .replace(/\b([a-z])/g, (m,c)=>c.toUpperCase())
    // keep common name particles lowercase (de, dela, van, etc.) unless first word
    .replace(/\b(De|Dela|Del|Della|Van|Von|Da|Di|La|Le)\b/g, (m,p,off)=> off===0? m : p.toLowerCase())
    // fix Mc/Mac and apostrophes/hyphens: O'brien -> O'Brien, mary-jane -> Mary-Jane
    .replace(/([A-Za-z])([''-])([a-z])/g,(m,a,sep,b)=>a+sep+b.toUpperCase());
}

// ---- Employee name autocomplete (predictive suggestions) ----
const EMPLOYEES=[
  "Mark Ian Buenzalida","Rose Villano","Marivie Marquez",
  "Camila Haduca","Monique Eileen Irog-irog","John Louis Marcos Dionisio"
];
const acNorm=s=>s.toLowerCase().replace(/[^a-z\s-]/g,"").trim();
function acSuggest(q){
  q=acNorm(q); if(!q) return [];
  return EMPLOYEES.map(name=>{
    const parts=acNorm(name).split(/[\s-]+/);
    const initials=parts.map(p=>p[0]).join("");
    let s=-1;
    if(parts[0].startsWith(q)) s=0;                 // "mark" -> Mark Ian
    else if(parts.some(p=>p.startsWith(q))) s=1;    // "ian"  -> Mark Ian
    else if(initials.startsWith(q)) s=2;            // "jl"   -> John Louis
    else if(acNorm(name).includes(q)) s=3;          // fallback substring
    return {name,s};
  }).filter(r=>r.s>=0).sort((a,b)=>a.s-b.s||a.name.localeCompare(b.name))
    .slice(0,5).map(r=>r.name);
}

// ---- Evaluator column names: manager = Eval 1, then the other employees ----
const FIRST_OVERRIDE={
  "Mark Ian Buenzalida":"Mark Ian",
  "John Louis Marcos Dionisio":"John Louis",
  "Monique Eileen Irog-irog":"Monique"
};
function firstNameOf(full){
  const n=String(full||"").trim();
  if(!n) return "";
  const hit=Object.keys(FIRST_OVERRIDE).find(k=>k.toLowerCase()===n.toLowerCase());
  return hit?FIRST_OVERRIDE[hit]:n.split(/\s+/)[0];
}
function matchedEmployee(){
  const v=acNorm(document.getElementById('empName').value);
  return v?(EMPLOYEES.find(n=>acNorm(n)===v)||null):null;
}
function evaluatorNames(){
  if(currentProfile) return [currentProfile.full_name];
  return [firstNameOf(document.getElementById('manager').value)||"Manager"];
}
let lastEvKey="";
function syncEvaluators(force){
  const names=evaluatorNames();
  const key=role+"|"+names.join("|")+"|"+evaluators;
  if(!force && key===lastEvKey) return;
  lastEvKey=key;
  if(names.length && evaluators!==Math.min(MAX_EV,names.length)){
    evaluators=Math.min(MAX_EV,names.length);
    document.getElementById('evVal').textContent=evaluators;
    buildBody();
  }
  buildHead(); compute();
}

(function initAutocomplete(){
  return;
  const inp=document.getElementById('empName');
  const wrap=inp.closest('.field');
  wrap.style.position='relative';

  const box=document.createElement('div');
  box.className='ac-box';
  wrap.appendChild(box);

  let items=[], idx=-1;
  const open=()=>box.classList.add('open');
  const close=()=>{ box.classList.remove('open'); idx=-1; };
  const isOpen=()=>box.classList.contains('open');

  function paint(){
    box.innerHTML='';
    items.forEach((n,i)=>{
      const d=document.createElement('div');
      d.className='ac-item'+(i===idx?' sel':'');
      d.textContent=n;
      d.addEventListener('mousedown',ev=>{ ev.preventDefault(); pick(n); });
      box.appendChild(d);
    });
    items.length?open():close();
  }
  function pick(name){ inp.value=name; inp.classList.remove('bad'); close(); syncEvaluators(); inp.focus(); }
  function move(step){
    if(!items.length) return;
    idx=(idx+step+items.length)%items.length;
    [...box.children].forEach((c,i)=>c.classList.toggle('sel',i===idx));
  }

  inp.addEventListener('input',()=>{ items=acSuggest(inp.value); idx=-1; paint(); });
  inp.addEventListener('focus',()=>{ if(inp.value.trim()){ items=acSuggest(inp.value); idx=-1; paint(); } });
  inp.addEventListener('blur',()=>setTimeout(close,120));

  // capture phase: runs BEFORE the Enter -> first-score-box handler above
  inp.addEventListener('keydown',e=>{
    if(!isOpen()) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); e.stopPropagation(); move(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); e.stopPropagation(); move(-1); }
    else if(e.key==='Escape'){ e.stopPropagation(); close(); }
    else if(e.key==='Enter'||e.key==='Tab'){
      if(idx>=0){ e.preventDefault(); e.stopPropagation(); pick(items[idx]); }
      else close();
    }
  },true);
})();
