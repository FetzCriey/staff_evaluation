<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Better Practice</title>
<link rel="icon" type="image/png" sizes="32x32" href="better-practice-favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a2233;--ink-soft:#28455c;--muted:#5b7080;--lagoon:#15ACE3;--lagoon-deep:#0b7fb0;--lagoon-dark:#08344c;--mist:#eaf4fa;--panel:#fff;--line:#d3e5f0;--error-bg:#fff0f0;--error-ink:#a62a2a;--error-line:#f1caca;--ok-bg:#edf9f3;--ok-ink:#187648;--ok-line:#bfe5cf;--shadow:0 24px 70px -20px rgba(8,52,76,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--mist);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(470px,100%);overflow:hidden;border-radius:24px;background:var(--panel);box-shadow:var(--shadow)}.head{padding:28px 30px;color:#fff;background:radial-gradient(120% 90% at 85% -10%,rgba(21,172,227,.55),transparent 55%),linear-gradient(160deg,#0c3a54 0%,var(--lagoon-dark) 58%,#051e2d 100%)}.brand{display:flex;align-items:center;gap:12px}.brand img{width:46px;height:46px;border-radius:12px;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.3)}.brand strong{font-family:"Bricolage Grotesque","Inter",sans-serif;font-size:16px}.head h1{margin:24px 0 6px;font-family:"Bricolage Grotesque","Inter",sans-serif;font-size:27px}.head p{margin:0;color:rgba(225,244,252,.82);font-size:13px;line-height:1.55}.body{padding:28px 30px 30px}label{display:block;margin:0 0 7px;color:var(--ink-soft);font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.password-wrap{position:relative;margin-bottom:17px}.password-wrap input{margin:0;padding-right:62px}.eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:7px 9px;border:0;background:transparent;color:var(--lagoon-deep);box-shadow:none;font-size:11px;font-weight:800}.eye:hover{transform:translateY(-50%);box-shadow:none;filter:none;background:var(--mist)}input{width:100%;min-height:45px;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fbfdff;color:var(--ink);font:500 14px "Inter",sans-serif;outline:none}input:focus{border-color:var(--lagoon);box-shadow:0 0 0 4px rgba(21,172,227,.14);background:#fff}.plain-input{margin-bottom:17px}.notice{display:none;margin-bottom:16px;padding:11px 13px;border-radius:10px;font-size:12px;line-height:1.5}.notice.error{display:block;background:var(--error-bg);border:1px solid var(--error-line);color:var(--error-ink)}.notice.ok{display:block;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink)}button{width:100%;border:0;border-radius:11px;background:linear-gradient(180deg,var(--lagoon),var(--lagoon-deep));color:#fff;font:700 14px "Inter",sans-serif;padding:13px;cursor:pointer;box-shadow:0 10px 24px -8px rgba(21,172,227,.52)}button:disabled{opacity:.6;cursor:not-allowed}.back{display:block;margin-top:16px;text-align:center;color:var(--lagoon-deep);font-size:12px;font-weight:700;text-decoration:none}.back:hover{text-decoration:underline}.loading{color:var(--muted);font-size:12px;line-height:1.5;text-align:center;padding:6px 0}.hide{display:none!important}@media(max-width:560px){body{padding:14px}.head{padding:24px 22px}.body{padding:24px 22px 26px}}
</style>
</head>
<body>
<div class="shell">
  <header class="head"><div class="brand"><img src="Better Practice Consulting Inc.png" alt="Better Practice Consulting Inc. logo"><strong>Better Practice</strong></div><h1>Choose a new password</h1><p>Use the secure link from your password reset email. The link can only be used to update the account it was issued for.</p></header>
  <main class="body">
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div id="loading" class="loading">Verifying your password reset link...</div>
    <form id="resetForm" class="hide">
      <label for="newPassword">New password</label>
      <div class="password-wrap"><input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><button id="eye" class="eye" type="button">Show</button></div>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" class="plain-input" type="password" autocomplete="new-password" minlength="8" placeholder="Enter it again" required>
      <button id="saveBtn" type="submit">Set new password</button>
    </form>
    <a class="back" href="login.html">Back to login</a>
  </main>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const recoveryHint=/type=recovery/i.test(window.location.hash)||new URLSearchParams(window.location.search).has("code");
const supabase=createClient("https://giosjwjhalhmwcuyzfos.supabase.co","sb_publishable_9guZ2oKWHmKyFx3WyvHYww_cTYlQsX_");
const form=document.getElementById("resetForm"),loading=document.getElementById("loading"),notice=document.getElementById("notice"),pw=document.getElementById("newPassword"),confirm=document.getElementById("confirmPassword"),saveBtn=document.getElementById("saveBtn"),eye=document.getElementById("eye");
let recoveryReady=false;
function showNotice(message,kind="error"){notice.textContent=message;notice.className="notice "+kind}
function setReady(session){if(!session)return;recoveryReady=true;loading.classList.add("hide");form.classList.remove("hide");pw.focus();try{history.replaceState({},document.title,"reset-password.html")}catch(_){}}
const {data:listener}=supabase.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY")setReady(session)});
const query=new URLSearchParams(window.location.search);const code=query.get("code");
if(code){const {data,error}=await supabase.auth.exchangeCodeForSession(code);if(error)showNotice(error.message||"This reset link is invalid or has expired.");else setReady(data.session)}
if(!recoveryReady){const {data:{session}}=await supabase.auth.getSession();if(session&&recoveryHint)setReady(session)}
if(!recoveryReady){loading.classList.add("hide");showNotice("This password reset link is invalid, expired, or has already been used. Request a new link from the login page.")}
eye.addEventListener("click",()=>{const show=pw.type==="password";pw.type=show?"text":"password";confirm.type=show?"text":"password";eye.textContent=show?"Hide":"Show";pw.focus()});
form.addEventListener("submit",async event=>{event.preventDefault();notice.className="notice";if(!recoveryReady){showNotice("Open the password reset link from your email first.");return}if(pw.value.length<8){showNotice("Use at least 8 characters.");pw.focus();return}if(pw.value!==confirm.value){showNotice("The two passwords do not match.");confirm.focus();return}saveBtn.disabled=true;saveBtn.textContent="Saving...";const {error}=await supabase.auth.updateUser({password:pw.value});if(error){showNotice(error.message||"Could not update the password.");saveBtn.disabled=false;saveBtn.textContent="Set new password";return}await supabase.auth.signOut({scope:"local"});showNotice("Your password has been updated. You can now sign in with the new password.","ok");form.classList.add("hide");setTimeout(()=>window.location.replace("login.html"),1800)});
window.addEventListener("pagehide",()=>listener?.subscription?.unsubscribe?.());
</script>
</body>
</html>
